services:
  api:
    image: node:20-alpine
    container_name: featism-api
    working_dir: /api
    volumes:
      - ./api:/api
    env_file:
      - ./api/.env
    command: sh -lc "npm i && node server.js"
    environment:
      PORT: "4242"
      CORS_ORIGIN: "http://localhost:5173"
      FIREBASE_EMULATOR_HOST: "firebase:8080"
      GOOGLE_CLOUD_PROJECT: "demo-auth"
    ports:
      - "4242:4242"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4242/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      firebase:
        condition: service_started
    networks: [appnet]

  frontend:
    image: node:20-alpine
    container_name: featism-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -lc "npm i && npm run dev -- --host"
    depends_on:
      api:
        condition: service_healthy
      firebase:
        condition: service_started
    restart: unless-stopped
    networks: [appnet]

  firebase:
    build:
      context: ./firebase-emulator
      dockerfile: Dockerfile
    container_name: firebase-emulator
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "4000:4000"   # Emulator UI
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
      - "9199:9199"   # Storage (必要なら)
    command: sh -lc "node -v && java -version && firebase --version && firebase emulators:start --only firestore,auth --project demo-plasmic"
    restart: unless-stopped
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  frontend_node_modules:
